<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Reset Password</title>
  <desc id="desc">Lock and shield illustration for password reset.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="540" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="160" width="460" height="290" rx="28" fill="#ffffff"/>
    <rect x="290" y="130" width="320" height="90" rx="45" fill="#e2e8f0"/>
    <rect x="350" y="210" width="200" height="170" rx="20" fill="url(#main)"/>
    <circle cx="450" cy="280" r="22" fill="#ffffff"/>
    <rect x="438" y="292" width="24" height="48" rx="10" fill="#ffffff"/>
  </g>

  <text x="450" y="498" text-anchor="middle" fill="#0f172a" font-size="64" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Reset Password
  </text>
</svg>
