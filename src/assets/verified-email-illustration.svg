<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Verified Email</title>
  <desc id="desc">Envelope illustration with a verified checkmark and text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="900" height="540" fill="url(#bg)"/>

  <g transform="translate(80 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="740" height="360" rx="26" fill="#f8fafc"/>
    <path d="M0 26 C120 126, 250 172, 370 222 C490 172, 620 126, 740 26 L740 0 L0 0 Z" fill="#e5e7eb"/>
  </g>

  <g transform="translate(450 282)">
    <circle cx="0" cy="0" r="54" fill="#10b981"/>
    <path d="M-22 -2 L-6 14 L24 -18" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="450" y="456" text-anchor="middle" fill="#111827" font-size="72" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Verified Email
  </text>
</svg>
